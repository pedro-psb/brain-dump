<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <title>Pulp leaf and citrus pattern cell</title>
  <defs>
    <g id="orange-slice">
      <circle r="34" fill="#ff9507"/>
      <circle r="29" fill="#ffc85b"/>
      <circle r="24" fill="#ffad2e"/>
      <g fill="none" stroke="#fff0c9" stroke-linecap="round" stroke-width="2.5">
        <path d="M0-4V-24"/>
        <path d="M0 4V24"/>
        <path d="M-4 0H-24"/>
        <path d="M4 0H24"/>
        <path d="m-3-3-17-17"/>
        <path d="m3 3 17 17"/>
        <path d="m3-3 17-17"/>
        <path d="m-3 3-17 17"/>
      </g>
      <circle r="4" fill="#fff0c9"/>
    </g>
    <mask id="leaf-veins" maskUnits="userSpaceOnUse" x="-48" y="-48" width="96" height="96">
      <rect x="-48" y="-48" width="96" height="96" fill="white"/>
      <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 38C-4 15-6-12-7-38" stroke-width="3.2"/>
        <path d="M-1 23C-7 18-13 14-19 11M-2 12C4 8 10 4 16-1" stroke-width="2.4"/>
        <path d="M-3 1C-9-5-14-9-19-13M-4-9C2-14 7-19 12-24" stroke-width="2.2"/>
        <path d="M-5-19C-8-23-10-27-10-31M-5-25C-2-28 0-31 1-34" stroke-width="1.8"/>
      </g>
    </mask>
    <g id="leaf">
      <path d="M0 42C-7 20-43-1-8-43 21-40 38-12 0 42Z" fill="#04ae19" mask="url(#leaf-veins)"/>
    </g>
  </defs>

  <!-- Irregular centers keep the repeated tile from forming visible rows. -->
  <use href="#leaf" transform="translate(36 60) rotate(-38) scale(.9)"/>
  <use href="#orange-slice" transform="translate(196 145) scale(1.05)"/>
  <use href="#leaf" transform="translate(408 44) rotate(48) scale(1.04)"/>
  <use href="#orange-slice" transform="translate(104 271) scale(.78)"/>
  <use href="#leaf" transform="translate(317 213) rotate(34) scale(.82)"/>
  <use href="#orange-slice" transform="translate(428 108) scale(.55)"/>
</svg>
